// Добавление Muri в planetList (обязательно для отображения облаков в полёте)
@Scatterer_planetsList:AFTER[BeyondStars]
{
    @scattererCelestialBodies
    {
        Item
        {
            celestialBodyName = Muri
            transformName = Muri
            loadDistance = 300000000
            unloadDistance = 500000000
            hasOcean = True
            flatScaledSpaceModel = False
            usesCloudIntegration = True
            cloudIntegrationUsesScattererSunColors = False
            mainSunCelestialBody = AlkeronaA
            sunsUseIntensityCurves = False
            secondarySuns
            {
                Item
                {
                    celestialBodyName = AlkeronaB
                    sunColor = 1.000, 0.957, 0.914
                }
            }
        }
    }
}
@EVE_CLOUDS:NEEDS[StockVolumetricClouds]:FOR[BeyondStars]
{
    OBJECT
    {
        name = Muri-low-layer
        body = Muri
        altitude = 2500
