@Kopernicus:LAST[BeyondStars]:HAS[@BeyondStarsSettings:HAS[#Rescale[10]]]
{
    @Body:HAS[#Tag[Planet]]
    {
        @Properties
        {
            @radius *= 10
        }
        @Orbit
        {
            @semiMajorAxis *= 10
        }
    }
	@Body:HAS[#Tag[Moon]]
    {
        @Properties
        {
            @radius *= 10
        }
        @Orbit
        {
            @semiMajorAxis *= 10
        }
    }

	// Stars

	@Body:HAS[#Tag[Star]]
    {
        @Properties
        {
            @radius *= 2.66
            @mass *= 100
            @sphereOfInfluence *= 10
        }
        @Orbit
        {
            @semiMajorAxis *= 10
        }
    }
    @Body:HAS[#Tag[BinaryStar]]
